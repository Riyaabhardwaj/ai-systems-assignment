name: CI/CD

on:
  push:
    branches:
      - "*"

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

        with:
          node-version: 22

      - run: npm install

      - run: npm run lint

      - run: npm test

  deploy:

    needs: test

    if: github.ref=='refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - run: echo "Deploying to staging..."